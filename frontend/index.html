
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KuISOKO - Modern Marketplace</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* iOS Safari auto-zooms the page when a focused form field's font-size is under 16px.
       Several form inputs use smaller Tailwind text utilities for visual density, so this
       overrides them (site-wide, current and future forms) below the tablet breakpoint. */
    @media (max-width: 640px) {
      input, select, textarea { font-size: 16px !important; }
    }
    
    .fade-in { animation: fadeIn 0.5s ease-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .mega-menu-enter {
      opacity: 0;
      transform: translateY(-10px) scale(0.99);
      pointer-events: none;
      visibility: hidden;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .group:hover .mega-menu-enter {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
      visibility: visible;
    }

    .category-marquee-track {
      animation: categoryMarquee 30s linear infinite;
    }
    .category-marquee-track:hover {
      animation-play-state: paused;
    }
    @keyframes categoryMarquee {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    .banner-marquee-track {
      animation: bannerMarquee 25s linear infinite;
    }
    .banner-marquee-track:hover {
      animation-play-state: paused;
    }
    @keyframes bannerMarquee {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

  </style>
<script type="importmap">

    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",

  }
}
</script>
